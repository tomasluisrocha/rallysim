# The single-track circle on the four-wheel car: 20 s at 6 m/s (speed held), straight for a second, then the
# wheel goes to 0.2 rad over 0.1 s and stays. Same car numbers, so the two models can be overlaid.

[scenario]
name = fw_circle

[run]
duration = 20 s

[start]
speed = 6

[driver]
hold_speed = 6
steer = 0 @ 0, 0 @ 1 s, 0.2 @ 1.1 s, 0.2 @ 20 s
