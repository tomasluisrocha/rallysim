# The single-track lane change on the four-wheel car: 7 s at 15 m/s (speed held), one period of a triangle-wave
# steer of 0.02 rad after a second of straight driving.

[scenario]
name = fw_lane

[run]
duration = 7 s

[start]
speed = 15

[driver]
hold_speed = 15
steer = 0 @ 0, 0 @ 1 s, 0.02 @ 2 s, 0 @ 3 s, -0.02 @ 4 s, 0 @ 5 s, 0 @ 7 s
