# Crest jump into a handbrake hairpin, on gravel.
#
# The car leaves a crest at 50 km/h, 25 cm in the air and slightly nose up, lands, slows to 30 km/h, turns in,
# pulls the handbrake to swing the rear round, and the heading-hold driver takes it out the way it came.
#
# This file uses every feature of the format (docs/implementation.md) and is the reference the loader is built
# against. Its numbers are plausible, not tuned: once it runs, the hairpin may need adjusting.

[scenario]
name = fw_showcase
description = Crest jump into a handbrake hairpin, on gravel   # text runs up to the comment

[run]
model = four_wheel
duration = 10 s
dt = 0.5 ms                       # half the usual step: 20000 steps

[start]
position = (0, 0, 0.77) m         # CG 25 cm above its ride height (cg_height below is 0.52 m): airborne
heading = 30 deg
pitch = -2 deg                    # nose up, off the crest (ISO: + is nose down)
roll = 0                          # no unit: the key's own, rad
velocity = (12.0, 7.5, 0) m/s     # world frame: about 51 km/h, a few degrees off the heading (some sideslip)
angular_velocity = (0, -0.1, 0)   # rad/s, body frame: the nose still rising

[car]
# body
mass = 1.25 t
cg_height = 520 mm
inertia_z = 1550                  # kg m^2
# gravel: less grip than the default tarmac-like 1.0
mu_front = 0.75
mu_rear = 0.75
k_front = 10 %
k_rear = 10 %
tyre_curve_front = tmeasy         # per axle; tyre_curve = tmeasy would set both
tyre_curve_rear = tmeasy
calpha_front = 28 kN/rad
calpha_rear = 33 kN/rad
# softer rally suspension
vertical = springs
spring_front = 45 kN/m
spring_rear = 42 N/mm
damper_front = 3.6 kN s/m
damper_rear = 3400                # N s/m
# AWD, gravel brake bias
drive_split_front = 30 %
max_drive_power = 210 kW
brake_bias_front = 62 %
max_handbrake_torque = 3.2 kN m

[driver]
# the speed controller works the throttle and brake, so they are not given here
hold_speed = 50 km/h @ 0,
             50 km/h @ 1.5 s,     # straight on after landing
             30 km/h @ 2.5 s,     # braking for the hairpin
             30 km/h @ 6 s,
             45 km/h @ 9 s        # and away
steer = 0 @ 0, 0 @ 2.6 s, 18 deg @ 3.0 s
handbrake = 0 @ 3.2 s, 100 % @ 3.25 s,
            100 % @ 3.55 s, 0 @ 3.6 s
# from the release, the heading-hold driver steers it out the way it came
hold_heading = 210 deg            # 30 + 180
hold_heading_from = 3.6 s
heading_gain = 2.5                # 1/s
max_yaw_rate = 70 deg/s
yaw_rate_gain = 0.35              # s
