# Hairpin: a rally U-turn on the handbrake. All-wheel drive (30/70), 8 m/s held; the wheel turned in to 0.4 rad
# over 0.2 s from 1 s, the handbrake pulled fully for 0.3 s from 1.3 s to swing the tail round; from its release
# the heading-hold driver steers to the opposite heading, countersteering to catch the slide, and the speed
# controller drives back up to 8 m/s. It turns 180 degrees for pulls from 0.5 to 1.0.
#
# Each input has a point at every time where any input changes, so the script matches the built-in one key for
# key. 1.6500000000000001 is 1.6 s + 0.05 s as the built-in scenario computes it.

[scenario]
name = fw_hairpin

[run]
duration = 8 s

[start]
speed = 8

[car]
drive_split_front = 0.3

[driver]
hold_speed = 8
steer = 0 @ 0, 0 @ 1 s, 0.4 @ 1.2 s, 0.4 @ 1.3 s, 0.4 @ 1.35 s, 0.4 @ 1.6 s, 0.4 @ 1.6500000000000001 s,
        0.4 @ 8 s
handbrake = 0 @ 0, 0 @ 1 s, 0 @ 1.2 s, 0 @ 1.3 s, 1 @ 1.35 s, 1 @ 1.6 s, 0 @ 1.6500000000000001 s,
            0 @ 8 s
hold_heading = 3.141592653589793      # pi: the way it came, reversed
hold_heading_from = 1.6 s
