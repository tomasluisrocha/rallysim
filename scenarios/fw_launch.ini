# Launch: all-wheel drive with 30% of the torque on the front, rolling at 2 m/s, full throttle from 0.5 s for
# 3 s. The wheels spin up, the car accelerates at about 1 g, then the engine runs out of power and the
# acceleration falls as P / (m v).

[scenario]
name = fw_launch

[run]
duration = 3.5 s

[start]
speed = 2

[car]
drive_split_front = 0.3

[driver]
throttle = 0 @ 0, 0 @ 0.5 s, 1 @ 0.55 s, 1 @ 3.5 s
