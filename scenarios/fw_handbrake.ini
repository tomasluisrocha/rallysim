# Handbrake flick: 15 m/s held, a gentle left turn from 1 s, then a short partial pull of the handbrake (0.40 for
# 0.3 s from 2.5 s) and the wheel straightened after it. The inner rear locks, the rear steps out (about 7 degrees
# of sideslip) and the car recovers. A pull of 0.44 spins it: the edge is sharp on a tyre with a fall-off.
#
# Each input has a point at every time where any input changes, so the script matches the built-in one key for
# key (a held value is then interpolated between equal points, exactly as before).

[scenario]
name = fw_handbrake

[run]
duration = 6 s

[start]
speed = 15

[driver]
hold_speed = 15
steer = 0 @ 0, 0 @ 1 s, 0.05 @ 1.3 s, 0.05 @ 2.5 s, 0.05 @ 2.55 s, 0.05 @ 2.85 s, 0.05 @ 2.9 s,
        0 @ 3.2 s, 0 @ 6 s
handbrake = 0 @ 0, 0 @ 1 s, 0 @ 1.3 s, 0 @ 2.5 s, 0.4 @ 2.55 s, 0.4 @ 2.85 s, 0 @ 2.9 s,
            0 @ 3.2 s, 0 @ 6 s
