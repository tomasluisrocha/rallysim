# Straight-line braking from 25 m/s: full brake from 1.05 s until the car stops. On the car's tmeasy tyre each
# locked tyre keeps 75% of its grip along the wheel, so the stop takes about 3.3 s and 42.5 m.

[scenario]
name = fw_brake

[run]
duration = 5 s

[start]
speed = 25

[driver]
brake = 0 @ 0, 0 @ 1 s, 1 @ 1.05 s, 1 @ 5 s
