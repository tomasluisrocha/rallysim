# A slow ramp of the steering wheel at a fixed throttle, open loop: nothing reacts to the car, so two tyres
# or two setups get the same inputs and can be compared by the car's own response. The ramp is slow enough
# for a steady understeer gradient (python tools/rally.py handling). The speed falls a little as the turn
# tightens, from 20 to about 19.4 m/s.

[scenario]
name = fw_ramp

[run]
duration = 21 s

[start]
speed = 20

[driver]
throttle = 0.08
steer = 0 @ 0, 0 @ 1 s, 0.08 @ 21 s
